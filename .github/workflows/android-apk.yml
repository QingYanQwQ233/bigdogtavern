name: Build Tavern APK

on:
  push:
    branches: [main]
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy frontend into APK assets
        run: |
          mkdir -p android/app/src/main/assets/data
          # 前端资源（明确列出；绝不复制 public/data/ 下的运行时文件——含用户 API key）
          cp public/index.html public/styles.css public/app.js \
             public/manifest.json public/sw.js public/favicon.svg \
             android/app/src/main/assets/
          cp -r public/vendor public/icons android/app/src/main/assets/
          # 仅模板数据（_defaults.json），运行时文件由 App 首次启动生成
          cp public/data/_defaults.json android/app/src/main/assets/data/

      - name: Build APK
        run: |
          cd android
          # versionCode = commit 数（每次 push 递增）；versionName 语义版本
          VCODE=$(git rev-list --count HEAD)
          echo "versionCode=$VCODE versionName=alpha-0.1.0"
          gradle assembleDebug --no-daemon -Pvc=$VCODE -Pvn=alpha-0.1.0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tavern-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
