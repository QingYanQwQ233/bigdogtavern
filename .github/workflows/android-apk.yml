name: Build Tavern APK

on:
  push:
    branches: [main]
  workflow_dispatch: # 手动触发

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy frontend into APK assets
        run: |
          # 每个 APK 使用独立资源版本，避免覆盖安装后 WebView Service Worker 命中旧壳
          ASSET_VERSION="apk-${{ github.run_number }}"
          # 当前 Web 资源版本可能已更新，按字段替换而不是依赖某个旧版本号
          sed -E -i "s#(styles.css\\?v=)[^\" ]+#\\1${ASSET_VERSION}#; s#(app.js\\?v=)[^\" ]+#\\1${ASSET_VERSION}#" public/index.html
          sed -E -i "s#const ASSET_VERSION = '[^']+';#const ASSET_VERSION = '${ASSET_VERSION}';#" public/sw.js
          mkdir -p android/app/src/main/assets/data
          # 前端资源（明确列出；绝不复制 public/data/ 下的运行时文件——含用户 API key）
          cp public/index.html public/styles.css public/app.js public/mapgen.js \
             public/manifest.json public/sw.js public/favicon.png \
             android/app/src/main/assets/
          cp -r public/vendor public/icons android/app/src/main/assets/
          # 仅模板数据（_defaults.json），运行时文件由 App 首次启动生成
          cp public/data/_defaults.json android/app/src/main/assets/data/

      - name: Build APK
        run: |
          cd android
          # versionCode / versionName 都用 GitHub 全局运行序号（仓库级递增；git rev-list 在 fetch-depth=1 下恒为 1，不可用）
          VCODE=${{ github.run_number }}
          VNAME="alpha-0.1.${{ github.run_number }}"
          echo "versionCode=$VCODE versionName=$VNAME"
          gradle assembleDebug --no-daemon -Pvc=$VCODE -Pvn=$VNAME

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tavern-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
