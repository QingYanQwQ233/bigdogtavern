name: Build Tavern APK

on:
  # 仅手动触发：避免日常提交浪费构建额度；需要 APK 时在 Actions 页 Run workflow。
  workflow_dispatch: # 手动触发

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 内嵌 Node 运行时：下载 nodejs-mobile 的 libnode.so，并用 NDK 编译 JNI 桥。
      # 产物落在 android/app/src/main/jniLibs/（不入库，每次构建现取）。
      # 脚本会从 ANDROID_HOME / ANDROID_SDK_ROOT 自动定位 NDK。
      - name: Fetch Node runtime and build JNI bridge
        run: bash scripts/fetch_android_node.sh

      # 确保提交的 public/app.js 与 frontend/ 源码一致
      - name: Verify frontend bundle is up to date
        run: node scripts/build_frontend.js --check

      # 后端 = server.js 本体，与前端一起放进 assets/nodejs/。
      # 资源版本号每个 APK 独立，避免覆盖安装后 WebView Service Worker 命中旧壳。
      - name: Sync server.js + public/ into APK assets
        run: bash scripts/sync_android_assets.sh "apk-${{ github.run_number }}"

      - name: Build APK
        run: |
          cd android
          # versionCode / versionName 都用 GitHub 全局运行序号（仓库级递增；git rev-list 在 fetch-depth=1 下恒为 1，不可用）
          VCODE=${{ github.run_number }}
          VNAME="alpha-0.1.${{ github.run_number }}"
          echo "versionCode=$VCODE versionName=$VNAME"
          gradle assembleDebug --no-daemon -Pvc=$VCODE -Pvn=$VNAME

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tavern-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
